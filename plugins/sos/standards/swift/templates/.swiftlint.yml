# .swiftlint.yml — SwiftLint strict configuration
# Based on Apple coding guidelines + big-tech standards

# ── Included / Excluded paths ────────────────────────────────────────────────
included:
  - Sources
  - Tests

excluded:
  - Pods
  - Carthage
  - .build
  - Build
  - DerivedData
  - "**/*.generated.swift"
  - "**/*.pb.swift"
  - Package.swift

# ── Enabled opt-in rules ─────────────────────────────────────────────────────
opt_in_rules:
  # Performance
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_first_last
  - contains_over_filter_count
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - flatmap_over_map_reduce
  - reduce_boolean
  - reduce_into

  # Safety
  - force_unwrapping
  - force_cast
  - force_try
  - implicitly_unwrapped_optional
  - required_deinit
  - unavailable_function
  - unowned_variable_capture
  - yoda_condition

  # Style
  - attributes
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - conditional_returns_on_newline
  - convenience_type
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name
  - file_name_no_space
  - file_types_order
  - function_default_parameter_at_end
  - ibinspectable_in_extension
  - identical_operands
  - joined_default_parameter
  - legacy_multiple
  - legacy_objc_type
  - let_var_whitespace
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nimble_operator
  - number_separator
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - private_subject
  - prohibited_interface_builder
  - prohibited_super_call
  - raw_value_for_camel_cased_codable_enum
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - single_test_class
  - sorted_imports
  - static_operator
  - strict_fileprivate
  - strong_iboutlet
  - switch_case_on_newline
  - toggle_bool
  - trailing_closure
  - type_contents_order
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - xct_specific_matcher

# ── Analyzer rules (`swiftlint analyze` only — needs compiler logs) ──────────
analyzer_rules:
  - explicit_self

# ── Disabled rules ───────────────────────────────────────────────────────────
disabled_rules:
  - todo   # Allow TODO comments during development
  - trailing_comma   # SwiftFormat handles this

# ── Rule configurations ──────────────────────────────────────────────────────
# The pre-commit hook runs `swiftlint lint --strict`: a warning fails the run too, so the `warning` number is the
# real limit of every rule below. The three quality limits therefore set warning = error (dev-standards
# common/quality-thresholds.yaml, verified by tests/enforcement-swift.bats).

# Complexity — SwiftLint counts branches only (no +1, no ?: / && / ||; case ignored below):
# 14 here = "1 + branches <= 15" in the standard's terms
cyclomatic_complexity:
  warning: 14
  error: 14
  ignores_case_statements: true

# Function length — lines between the braces, comments and blank lines excluded
function_body_length:
  warning: 50
  error: 50

# File length — comments and blank lines excluded
file_length:
  warning: 800
  error: 800
  ignore_comment_only_lines: true

# Type body length
type_body_length:
  warning: 400
  error: 600

# Line length
line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_function_declarations: false
  ignores_comments: false
  ignores_interpolated_strings: true

# Type name
type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60
  allowed_symbols: ["_"]
  validates_start_with_lowercase: error

# Identifier name
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k
    - db
    - to
    - ok
    - up
  allowed_symbols: ["_"]

# Large tuple
large_tuple:
  warning: 3
  error: 4

# Nesting
nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 3
    error: 4

# Closure body length
closure_body_length:
  warning: 30
  error: 50

# Enum case associated values count
enum_case_associated_values_count:
  warning: 4
  error: 5

# Function parameter count
function_parameter_count:
  warning: 5
  error: 7
  ignores_default_parameters: true

# Force unwrapping — error, not warning
force_unwrapping:
  severity: error

# Force cast — error, not warning
force_cast:
  severity: error

# Force try — error, not warning
force_try:
  severity: error

# Implicitly unwrapped optional — error, not warning
implicitly_unwrapped_optional:
  severity: error
  mode: all_except_iboutlets

# Number separator
number_separator:
  minimum_length: 5

# File types order
file_types_order:
  order:
    - supporting_type
    - main_type
    - extension
    - preview_provider

# Type contents order
type_contents_order:
  order:
    - associated_type
    - type_alias
    - subtype
    - case
    - type_property
    - instance_property
    - ib_inspectable
    - ib_outlet
    - initializer
    - deinitializer
    - type_method
    - view_life_cycle_method
    - ib_action
    - other_method
    - subscript

# Modifier order
modifier_order:
  # SwiftLint's default order (the previous list had an unknown group and was ignored)
  preferred_modifier_order:
    - override
    - isolation
    - acl
    - setterACL
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

# Sorted imports
sorted_imports:
  severity: warning

# Attributes
attributes:
  always_on_same_line:
    - "@IBAction"
    - "@IBOutlet"
    - "@NSManaged"
    - "@objc"
  always_on_line_above:
    - "@discardableResult"
    - "@MainActor"
    - "@available"

# Reporter
reporter: xcode
