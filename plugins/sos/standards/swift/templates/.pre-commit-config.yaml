repos:
  # ── File hygiene ───────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
      - id: detect-private-key

  # ── SwiftFormat — code formatting ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: swiftformat
        name: SwiftFormat
        entry: swiftformat --config .swiftformat
        language: system
        types: [swift]

  # ── SwiftLint — static analysis ────────────────────────────────────────────
  - repo: local
    hooks:
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint lint --strict --config .swiftlint.yml
        language: system
        types: [swift]

  # ── SwiftLint autocorrect — auto-fix (commit stage) ───────────────────────
  - repo: local
    hooks:
      - id: swiftlint-fix
        name: SwiftLint autocorrect
        entry: swiftlint lint --fix --config .swiftlint.yml
        language: system
        types: [swift]
        stages: [pre-commit]

  # ── detect-secrets — secret detection ──────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # ── file size limit (800 lines) ────────────────────────────────────────────
  - repo: local
    hooks:
      - id: file-size-limit
        name: File size limit (800 lines)
        entry: >
          bash -c 'f=0; for x in "$@"; do
            l=$(( $(wc -l < "$x") )); if [ "$l" -gt 800 ]; then
            echo "FAIL: $x ($l lines, max 800)"; f=1; fi; done; exit $f' --
        language: system
        files: \.swift$
        exclude: "(\\.generated\\.swift|\\.pb\\.swift)$"

  # ── coverage gate (push) — changed lines 80% + total never below .coverage-baseline ─────
  # scripts/coverage-gate.sh (copied by bootstrap; needs uv). Report: `swift test --enable-code-coverage` + `llvm-cov export -format=lcov`.
  # First adoption: run it once with --write-baseline and commit .coverage-baseline.
  - repo: local
    hooks:
      - id: coverage-gate
        name: Coverage gate (changed lines 80% + ratchet)
        entry: >
          bash -c 'set -e; swift test --enable-code-coverage;
          prof="$(dirname "$(swift test --show-codecov-path)")/default.profdata";
          bin="$(find .build \( -name "*PackageTests.xctest" -o -name "*Tests.so" \) -not -path "*.dSYM*" | head -1)";
          cov=llvm-cov; if [ "$(uname)" = Darwin ]; then cov="xcrun llvm-cov"; bin="$bin/Contents/MacOS/$(basename "$bin" .xctest)"; fi;
          $cov export -format=lcov -ignore-filename-regex="(Tests|\.build)/" -instr-profile "$prof" "$bin" > .build/lcov.info;
          scripts/coverage-gate.sh .build/lcov.info'
        language: system
        pass_filenames: false
        types: [swift]
        stages: [pre-push]

  # ── 테스트 영수증 대조 (push 시) ──────────────────────────────────────────
  # apply.sh --only hooks 가 배치한 .githooks/pre-push 를 pre-commit 이 실행한다 (git 훅 경로 설정 불필요)
  # 설치: pre-commit install --hook-type pre-commit --hook-type pre-push
  - repo: local
    hooks:
      - id: test-receipt-pre-push
        name: test receipt (pre-push)
        entry: .githooks/pre-push
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
