# AI Task 이슈 폼 — AI_TASK_SPEC_TEMPLATE.md 의 이슈 버전.
# 사람이 채우고 검토한 뒤 `ai-ready` 라벨을 "사람이" 붙이면 에이전트가 착수한다.
name: AI Task
description: AI 에이전트(Claude Code · Codex · Gemini)가 바로 구현할 수 있는 작업 명세
title: "[AI Task] "
labels: ["ai-task"]
body:
  - type: markdown
    attributes:
      value: |
        이 이슈 하나가 **작업 단위**입니다. 검토가 끝나면 사람이 `ai-ready` 라벨을 붙이고,
        에이전트는 착수 시 `ai-in-progress`, 결정이 필요하면 `needs-human` 으로 상태를 바꿉니다.
        에이전트는 `ai-ready` 를 스스로 붙이지 않습니다. PR 은 본문에 `Closes #<이 이슈 번호>` 를 적어 연결합니다.

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자에게 보이는 결과를 1~2문장으로
      placeholder: 로그인 실패 시 재시도 버튼이 보이고, 3회 실패하면 잠금 안내가 뜬다
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위 (In Scope)
      placeholder: |
        - 로그인 화면 재시도 버튼
        - 실패 횟수 카운트 (세션 단위)
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: 비범위 (Out of Scope)
      description: 이번에 하지 않을 것을 적어야 에이전트가 범위를 몰래 넓히지 않는다
      placeholder: |
        - 비밀번호 재설정 흐름
        - 관리자 잠금 해제 화면

  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준 (Acceptance Criteria)
      description: 테스트 · 브라우저 · 명령 출력으로 확인할 수 있는 문장으로
      placeholder: |
        - [ ] 잘못된 비밀번호 3회 → 잠금 안내 표시 (E2E)
        - [ ] 실패 카운트는 새로고침 후에도 유지 (단위 테스트)
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: 검증 명령
      description: 에이전트가 완료 전에 실행해야 하는 명령 — 훅이 이 명령의 통과를 영수증(.claude/receipts)으로 기록한다
      render: bash
      placeholder: |
        pnpm test -- auth
        pnpm typecheck

  - type: textarea
    id: docs
    attributes:
      label: 관련 문서
      placeholder: |
        - PRD: docs/product/...
        - Feature Spec: docs/specs/...
        - ADR / Design Doc: docs/adr/...

  - type: textarea
    id: risk
    attributes:
      label: 위험 · 롤백
      placeholder: |
        - 위험: 세션 저장소 스키마 변경
        - 롤백: feature flag LOGIN_RETRY=false

  - type: dropdown
    id: agent
    attributes:
      label: 담당 에이전트
      options:
        - 미정
        - Claude Code
        - Codex
        - Gemini
        - 사람
      default: 0
