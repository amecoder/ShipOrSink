# SonarQube Project Configuration
#
# 사용법:
#   1. 이 파일을 프로젝트 루트에 복사
#   2. sonar.projectKey, sonar.organization을 프로젝트에 맞게 수정
#   3. CI에서: sonar-scanner (환경변수 SONAR_TOKEN 필요)
#
# Quality Gate: Sonar way (커스터마이징은 SonarQube UI에서)
#   - 신규 코드 커버리지 >= 80%
#   - 신규 코드 중복률 <= 3%
#   - 신규 이슈 0건
#   - 보안 핫스팟 100% 리뷰

# ── 프로젝트 식별 ──────────────────────────────────────────
sonar.projectKey=my-org_my-project
sonar.organization=my-org
sonar.projectName=My Project

# ── 소스 경로 ──────────────────────────────────────────────
# Python
# sonar.sources=src
# sonar.tests=tests
# sonar.python.coverage.reportPaths=coverage.xml

# TypeScript/JavaScript
# sonar.sources=src
# sonar.tests=__tests__
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Go
# sonar.sources=.
# sonar.tests=.
# sonar.go.coverage.reportPaths=coverage.out

# Kotlin/Java
# sonar.sources=src/main
# sonar.tests=src/test
# sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# ── 제외 패턴 ──────────────────────────────────────────────
sonar.exclusions=**/node_modules/**,**/vendor/**,**/build/**,**/dist/**,**/*.test.*,**/*_test.*,**/test_*,**/migrations/**

# ── 인코딩 ────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── 신규 코드 정의 ────────────────────────────────────────
# Previous Version: 이전 버전 대비 변경분 분석
# Number of Days: 최근 N일 코드만 분석
sonar.newCode.referenceBranch=main
