version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # wait a week after a release before proposing it (supply-chain buffer)
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # wait a week after a release before proposing it (supply-chain buffer)
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # wait a week after a release before proposing it (supply-chain buffer)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # wait a week after a release before proposing it (supply-chain buffer)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # wait a week after a release before proposing it (supply-chain buffer)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # wait a week after a release before proposing it (supply-chain buffer)
