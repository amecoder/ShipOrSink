# ============================================================================
# Docker CI 워크플로우 템플릿
# ============================================================================
# 사용법: 이 파일을 프로젝트의 .github/workflows/ 에 복사하세요.
#   cp ci-docker.yml <your-project>/.github/workflows/ci-docker.yml
#
# 필수 조건:
#   - Dockerfile (프로젝트 루트 또는 DOCKERFILE_PATH 수정)
#   - (선택) .hadolint.yaml — hadolint 커스텀 규칙
#   - (선택) .trivyignore — Trivy 허용 CVE 목록
# ============================================================================

name: Docker CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".dockerignore"
      - ".github/workflows/ci-docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".dockerignore"

# 동일 브랜치/PR에서 중복 실행 방지
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 원칙
permissions:
  contents: read

env:
  # Dockerfile 경로 (프로젝트에 맞게 수정)
  DOCKERFILE_PATH: "./Dockerfile"
  # 이미지 이름 (레지스트리 없이 — 빌드 검증 용도)
  IMAGE_NAME: "app"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Dockerfile 린팅
  # ──────────────────────────────────────────────────────────────────────────
  hadolint:
    name: Hadolint (Dockerfile Lint)
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # DL3008: apt-get 버전 고정 경고 무시 (CI 이미지 특성상)
      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ env.DOCKERFILE_PATH }}
          # 무시할 규칙이 있으면 아래 주석 해제 후 수정
          # ignore: DL3008,DL3013

  # ──────────────────────────────────────────────────────────────────────────
  # Docker 빌드
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: hadolint
    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Docker 이미지 빌드 — push 없이 로컬 빌드만 (CI 검증)
      # GitHub Actions 캐시로 레이어 캐싱 활성화
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 빌드된 이미지를 tar로 저장 — 후속 job에서 사용
      - name: Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7} -o image.tar

      # 빌드 아티팩트 업로드
      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 보안 스캔 (Trivy)
  # ──────────────────────────────────────────────────────────────────────────
  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 소스 코드 체크아웃 (.trivyignore 파일 접근 용도)
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image

      # 저장된 이미지 로드
      - name: Load Docker image
        run: docker load -i image.tar

      # Trivy 이미지 취약점 스캔 — CRITICAL, HIGH 수준만 검사
      # CRITICAL/HIGH 취약점 발견 시 빌드 실패
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          # .trivyignore 파일로 허용된 CVE 관리 가능

      # Trivy SARIF 리포트 생성 (GitHub Security 탭 연동용, 실패해도 생성)
      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      # Trivy 스캔 결과를 아티팩트로 업로드
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-scan-report
          path: trivy-results.sarif
          retention-days: 14
