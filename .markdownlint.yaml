# markdownlint 설정 — 템플릿·규칙·가이드는 표·HTML·긴 줄을 자유롭게 쓰므로 서식 규칙은 완화하고,
# 실제 오류(깨진 링크 문법·중복 제목 등)만 잡는다.
default: true
MD013: false   # 줄 길이 — 표·URL·한글 문장에 맞지 않음
MD033: false   # 인라인 HTML — 템플릿의 <!-- 안내 주석 --> 허용
MD024:
  siblings_only: true   # 같은 레벨에서만 중복 제목 금지 (CHANGELOG 의 Added/Changed 반복 허용)
MD041: false   # 첫 줄 H1 — 프론트매터·설명 문단으로 시작하는 문서 허용
MD036: false   # 강조를 제목처럼 — 템플릿 안내문에 사용
MD029: false   # 번호 목록 스타일
MD034: false   # bare URL
MD040: false   # 코드 펜스 언어 지정 — 템플릿 예시는 생략 허용
MD060: false   # 표 구분선 정렬 스타일

# 아래는 공백·빈 줄 서식 규칙 — 기존 문서 100+ 개에 1,200건이 걸려 있어 이 PR 에서는 끄고,
# `markdownlint-cli2 --fix` 로 일괄 정리하는 후속 PR 에서 다시 켠다 (HANDOFF 후속 항목).
MD010: false   # hard tabs (Go · Makefile 예시 코드)
MD032: false   # 목록 앞뒤 빈 줄
MD022: false   # 제목 앞뒤 빈 줄
MD031: false   # 코드 펜스 앞뒤 빈 줄
MD009: false   # 줄 끝 공백
MD058: false   # 표 앞뒤 빈 줄
MD012: false   # 연속 빈 줄
MD025:
  front_matter_title: ""   # 프론트매터 title: 을 H1 으로 세지 않는다 (Obsidian MOC)
