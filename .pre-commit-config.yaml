# pre-commit — 커밋 전에 로컬에서 도는 검사. 설치: pre-commit install
# CI 의 shellcheck · gitleaks · markdownlint 와 같은 도구를 같은 설정으로 돌린다 (drift 방지).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(plugins/sos/standards/common/infra-templates/kubernetes/|.*/templates/.*\.ya?ml$)
      - id: check-json
        exclude: devcontainer\.json$   # JSONC (주석 허용) 규격
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
