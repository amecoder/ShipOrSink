# ============================================================================
# Python CI 워크플로우 템플릿
# ============================================================================
# 사용법: 이 파일을 프로젝트의 .github/workflows/ 에 복사하세요.
#   cp ci-python.yml <your-project>/.github/workflows/ci.yml
#
# 필수 조건:
#   - pyproject.toml 에 [tool.ruff], [tool.mypy] 설정 포함
#   - pytest + pytest-cov 설치
#   - pyproject.toml [tool.importlinter] 의 "app" 을 프로젝트 최상위 패키지 이름으로 바꿀 것
#     (그대로 두면 lint 잡이 "Could not find package 'app'" 로 실패한다 — 계층 경계 검사, python/README.md)
#   - (선택) SonarQube 사용 시 SONAR_TOKEN, SONAR_HOST_URL 시크릿 설정
# ============================================================================

name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 동일 브랜치/PR에서 중복 실행 방지
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 원칙
permissions:
  contents: read

env:
  # renovate: datasource=python-version depName=python versioning=semver-partial
  PYTHON_VERSION: "3.12"
  # renovate: datasource=docker depName=semgrep/semgrep
  SEMGREP_VERSION: "1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198"
  # 소스 디렉토리 (프로젝트에 맞게 수정)
  SRC_DIR: "src"
  # 테스트 디렉토리
  TEST_DIR: "tests"
  # 커버리지 최소 % (정본: dev-standards common/quality-thresholds.yaml)
  COVERAGE_THRESHOLD: "80"
  # 함수·파일 크기 훅(.pre-commit-config.yaml 로컬 훅)을 CI 에서 돌릴 pre-commit
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: "4.6.2"
  # 계층 경계 검사(pyproject.toml [tool.importlinter])
  # renovate: datasource=pypi depName=import-linter
  IMPORT_LINTER_VERSION: "2.15"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 린트 + 포맷 검사
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # Ruff 설치
      - name: Install Ruff
        run: pip install ruff

      # Ruff 린트 검사 — pyproject.toml 설정 기반
      - name: Ruff lint check
        run: ruff check ${{ env.SRC_DIR }} ${{ env.TEST_DIR }}

      # Ruff 포맷 검사 — 코드 스타일 일관성 확인
      - name: Ruff format check
        run: ruff format --check ${{ env.SRC_DIR }} ${{ env.TEST_DIR }}

      # 함수 50줄 · 파일 800줄 — ruff 에 없는 검사라 pre-commit 로컬 훅을 그대로 돌린다 (커밋 때 건너뛰어도 여기서 막힌다)
      # .pre-commit-config.yaml 이 저장소 루트에 있어야 한다. SRC_DIR 을 바꾸면 두 훅의 files: ^src/ 도 같이 바꾼다 (안 바꾸면 0개 검사로 통과)
      - name: Size limits (function · file)
        run: |
          pip install "pre-commit==${{ env.PRE_COMMIT_VERSION }}"
          pre-commit run function-length --all-files
          pre-commit run file-size-limit --all-files

      # 계층 경계 — domain 이 adapter·웹/ORM 프레임워크를 import 하거나 어댑터끼리 import 하면 실패한다.
      # 정적 분석이라 프로젝트 의존성 설치가 필요 없다. 최상위 패키지는 PYTHONPATH(SRC_DIR)에서 찾는다
      - name: Import contracts (import-linter)
        env:
          PYTHONPATH: ${{ env.SRC_DIR }}
        run: |
          pip install "import-linter==${{ env.IMPORT_LINTER_VERSION }}"
          lint-imports

  # ──────────────────────────────────────────────────────────────────────────
  # 타입 검사
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: mypy Type Check
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # 프로젝트 의존성 + mypy 설치
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy

      # mypy 엄격 모드 타입 검사 — pyproject.toml [tool.mypy] 설정 사용
      - name: Run mypy
        run: mypy ${{ env.SRC_DIR }}

  # ──────────────────────────────────────────────────────────────────────────
  # 테스트 + 커버리지
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # coverage gate: the PR base branch must be in the clone
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # 프로젝트 의존성 설치 (테스트 의존성 포함)
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # pytest 실행 + 커버리지 측정 (80% 미만 시 실패)
      - name: Run tests with coverage
        run: |
          pytest ${{ env.TEST_DIR }} \
            --cov=${{ env.SRC_DIR }} \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            -v

      # 바뀐 줄 80% + 전체가 .coverage-baseline 아래로 떨어지지 않음 — 전체 80% 검사(위 단계)와 함께 둔다.
      # PR 에서만(비교할 base 브랜치가 있을 때). scripts/coverage-gate.sh 는 bootstrap 이 복사하고,
      # diff-cover 는 게이트가 고정 버전으로 실행한다(runner 의 pipx 또는 uv)
      - name: Coverage gate (changed lines + ratchet)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}   # read as $BASE_REF in run: — never inline ${{ }} into shell
        run: bash scripts/coverage-gate.sh coverage.xml --compare-branch "origin/$BASE_REF"

      # 커버리지 리포트를 아티팩트로 업로드
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # 보안 스캔
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # Semgrep SAST 보안 스캔 — Python 전용 룰셋 적용
      - name: Semgrep security scan
        # semgrep/semgrep-action 은 아카이브됨 → 고정 이미지(태그+다이제스트)로 직접 실행. security-review.yml 과 같은 방식
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            "semgrep/semgrep:${SEMGREP_VERSION}" \
            semgrep scan --config p/python --config p/owasp-top-ten --config p/security-audit \
              --error --metrics=off --severity WARNING --severity ERROR

      # pip-audit 의존성 취약점 검사
      - name: Install pip-audit
        run: pip install pip-audit

      # 설치된 패키지의 알려진 취약점 검사
      - name: Run pip-audit
        run: |
          pip install -e ".[dev]"
          pip-audit

  # ──────────────────────────────────────────────────────────────────────────
  # SonarQube 분석 (선택적 — SONAR_TOKEN 시크릿 설정 시 실행)
  # ──────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    # lint, test 완료 후 실행 + SONAR_TOKEN 존재 시에만 실행
    needs: [lint, test]
    if: github.event_name == 'push' && vars.SONAR_ENABLED == 'true'
    steps:
      # 소스 코드 체크아웃 (전체 히스토리 — SonarQube 분석에 필요)
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # 커버리지 리포트 다운로드
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report

      # SonarQube 스캔 실행
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.sources=${{ env.SRC_DIR }}
            -Dsonar.tests=${{ env.TEST_DIR }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
